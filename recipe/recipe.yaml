schema_version: 1

context:
  version: "0.11.0"

package:
  name: conda-pypi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/conda-pypi/conda_pypi-${{ version }}.tar.gz
  sha256: 9137327ffef74aaac7a95e5940b39e4bc333c77f05d22efeb199af6767e3b481

build:
  # can't be noarch because we can't place EXTERNALLY-MANAGED in stdlib (first level is site-packages)
  # However, EXTERNALLY-MANAGED is temporarily disabled
  number: 2
  skip: match(python, "<3.10")
  script:
    - if: unix
      then: set -x
    - if: win
      then: "@ECHO ON"
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
  host:
    - python
    - pip
    - hatchling >=1.26
    - hatch-vcs >=0.2.0
  run:
    - python
    - pip >=23.0.1
    - packaging
    - unearth
    - python-build
    - python-installer >=1.0
    - platformdirs
    - conda-index >=0.11.0
    - conda-package-streaming >=0.11
  run_constraints:
    # This is technically a `run` dependency (we do import it), but
    # conda already depends on conda-pypi, so it creates a
    # dependency cycle that complicates migrations
    - conda >=26.1.0

tests:
  # linux-riscv64 bootstrap: `conda-index` has no installable linux-riscv64
  # dependency set yet -- both `conda >=25` and `msgpack-python` are still
  # unbuilt there -- so any test that creates an environment fails to solve.
  # Building conda for linux-riscv64 in turn needs conda-pypi (it is a bundled
  # plugin in conda's `run:`), so the cycle has to be broken here. The package
  # itself is fine: imports and `conda pypi --help` were verified on
  # linux-riscv64 under qemu emulation. Restore the full test suite once
  # conda-feedstock ships linux-riscv64 builds.
  - if: target_platform == "linux-riscv64"
    then:
      # package_contents is evaluated against the built package, so it needs no
      # test environment and still smoke-checks the artifact.
      - package_contents:
          site_packages:
            - conda_pypi/__init__.py
            - conda_pypi/main.py
    else:
      - python:
          imports:
            - conda_pypi
            - conda_pypi.main
          pip_check: true
      - requirements:
          run:
            - pip
        script:
          # Using 'conda pypi' directly on Windows fails due to the actual 'base' conda being found earlier than test-env's conda
          - python -m conda pypi --help

about:
  license: MIT
  license_file: LICENSE
  summary: Better PyPI interoperability for the conda ecosystem
  homepage: https://github.com/conda/conda-pypi
  repository: https://github.com/conda/conda-pypi
  documentation: https://conda.github.io/conda-pypi

extra:
  recipe-maintainers:
    - danyeaw
    - ryanskeith
    - jaimergp
    - jezdez
